events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream django_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        error_page 413 = @too_large;

        location @too_large {
            default_type text/html;
            return 413 '<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Demasiado Grande - WeekStory</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: "Inter", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .container {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-family: "Outfit", sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 50%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .icon-container {
            margin-bottom: 1.5rem;
        }
        .icon {
            font-size: 4rem;
            color: #f43f5e;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            font-family: "Outfit", sans-serif;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .details {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1rem;
            text-align: left;
        }
        .details ul {
            padding-left: 1.25rem;
            margin: 0.5rem 0 0 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <span class="icon">⚠️</span>
        </div>
        <h1>Archivo Demasiado Grande</h1>
        <p>El archivo que estás intentando subir supera el límite máximo permitido por el servidor (20 MB).</p>
        <button class="btn" onclick="window.history.back();">Volver a Intentarlo</button>
        <div class="details">
            <strong>Recomendaciones para subir imágenes:</strong>
            <ul>
                <li>Tamaño máximo del archivo: <strong>10.0 MB</strong></li>
                <li>Dimensiones máximas de resolución: <strong>4000x4000 píxeles</strong></li>
                <li>Formatos sugeridos: JPG, PNG, WebP o GIF</li>
            </ul>
        </div>
    </div>
</body>
</html>';
        }

        location / {
            proxy_pass http://django_app;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }
    }
}

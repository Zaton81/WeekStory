{% load static %}
<div id="story-audio-player-container" class="glass-card" style="margin-top: 1.5rem; padding: 1.5rem; border-radius: 16px; position: relative; overflow: hidden; background: rgba(15, 23, 42, 0.45); border: 1px solid rgba(255, 255, 255, 0.08);">
    <div id="tts-audio-player" data-story-id="{{ story.id }}" style="display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                <!-- Párrafo anterior -->
                <button id="tts-prev-btn"
                        type="button"
                        onclick="window.weekStoryTTS && window.weekStoryTTS.prevParagraph()"
                        title="Párrafo anterior"
                        style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.06); color: hsl(var(--text-primary)); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <!-- Play / Pause -->
                <button id="tts-play-pause-btn"
                        type="button"
                        onclick="window.weekStoryTTS && window.weekStoryTTS.togglePlayPause()"
                        title="Reproducir / Pausar"
                        style="width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(135deg, #a78bfa 0%, #38bdf8 100%); color: #000; font-size: 1.15rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); outline: none;">
                    <i id="tts-play-icon" class="fa-solid fa-play" style="margin-left: 2px;"></i>
                </button>

                <!-- Siguiente párrafo -->
                <button id="tts-next-btn"
                        type="button"
                        onclick="window.weekStoryTTS && window.weekStoryTTS.nextParagraph()"
                        title="Siguiente párrafo"
                        style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.06); color: hsl(var(--text-primary)); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <!-- Stop -->
                <button id="tts-stop-btn"
                        type="button"
                        onclick="window.weekStoryTTS && window.weekStoryTTS.stop()"
                        title="Detener lectura"
                        style="width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.06); color: hsl(var(--text-primary)); font-size: 0.95rem; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <i class="fa-solid fa-stop"></i>
                </button>

                <div style="margin-left: 0.25rem;">
                    <strong style="font-family: var(--font-heading); font-size: 1.1rem; color: hsl(var(--text-primary)); display: block;">Escuchar Relato</strong>
                    <span id="tts-status-label" style="font-size: 0.85rem; color: hsl(var(--text-muted)); display: flex; align-items: center; gap: 0.5rem;">
                        Lectura sincronizada por párrafos
                        <span class="badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.7rem; padding: 0.15rem 0.4rem; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2);">Web Speech</span>
                    </span>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <label for="tts-rate-select" style="font-size: 0.85rem; color: hsl(var(--text-muted));">Velocidad:</label>
                <select id="tts-rate-select"
                        onchange="window.weekStoryTTS && window.weekStoryTTS.setRate(this.value)"
                        style="background: rgba(0, 0, 0, 0.35); color: hsl(var(--text-primary)); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.85rem; cursor: pointer;">
                    <option value="0.8">0.8x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                </select>
            </div>
        </div>

        <!-- Barra de progreso por párrafos -->
        <div style="display: flex; align-items: center; gap: 0.75rem; width: 100%;">
            <div style="flex-grow: 1; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; position: relative; overflow: hidden;">
                <div id="tts-progress-fill"
                     style="width: 0%; height: 100%; background: linear-gradient(90deg, #a78bfa, #38bdf8); border-radius: 3px; transition: width 0.2s ease;"></div>
            </div>
            <span id="tts-progress-text" style="font-size: 0.75rem; color: hsl(var(--text-muted)); font-family: monospace; min-width: 45px; text-align: right;">0%</span>
        </div>
    </div>
</div>

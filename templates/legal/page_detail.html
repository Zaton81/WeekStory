{% extends 'base.html' %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; padding-top: 2vh;">
    <div style="margin-bottom: 2rem;">
        <a href="{% url 'stories:story-list' %}" class="story-meta"><i class="fa-solid fa-arrow-left"></i> Volver a Historias</a>
        <h1 class="gradient-text" style="margin-top: 0.5rem; font-size: 2.5rem;">{{ page.title }}</h1>
    </div>
    
    <div class="glass-card" style="line-height: 1.8; font-size: 1.05rem; color: hsl(var(--text-primary)); white-space: pre-line; padding: 2.5rem;">
        {{ page.content }}
    </div>
</div>
{% endblock %}
